# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = false

format = """
$os\
$shell\
[](bg:#33658A fg:#ffffff)\
$directory\
[](fg:#33658A bg:#ffffff)\
[](fg:#ffffff)\
$git_branch\
$git_status\
$docker_context\
$cmake\
$gradle\
$nodejs\
$package\
$python\
$rust
[ ](bg:#FFFFFF fg:#000000)[ ](fg:#ffffff)
"""

right_format = """
[](fg:#2f332f)\
$status\
[](fg:#ffffff bg:#2f332f)\
$cmd_duration
"""

# An alternative to the username module which displays a symbol that
# represents the current operating system
[os]
format = '[ $symbol]($style)'
style = "bg:#FFFFFF fg:#000000"
disabled = false

[os.symbols]
AIX = " "
AlmaLinux = " "
Alpaquita = " "
Alpine = " "
ALTLinux = " "
Amazon = " "
Android = " "
AOSC = " "
Arch = " "
Artix = " "
Bluefin = " "
CachyOS = " "
CentOS = " "
Debian = " "
DragonFly = " "
Elementary = " "
Emscripten = " "
EndeavourOS = " "
Fedora = " "
FreeBSD = " "
Garuda = " "
Gentoo = " "
HardenedBSD = "󰞌 "
Illumos = " "
InstantOS = " "
Ios = "󰀷 "
Kali = " "
Linux = " "
Mabox = " "
Macos = " "
Manjaro = " "
Mariner = " "
MidnightBSD = " "
Mint = " "
NetBSD = " "
NixOS = " "
Nobara = " "
OpenBSD = " "
OpenCloudOS = " "
openEuler = " "
openSUSE = " "
OracleLinux = "󰺡 "
PikaOS = " "
Pop = " "
Raspbian = " "
Redhat = "󱄛 "
RedHatEnterprise = "󱄛 "
Redox = "󰀘 "
RockyLinux = " "
Solus = " "
SUSE = " "
Ubuntu = " "
Ultramarine = " "
Unknown = " "
Uos = " "
Void = " "
Windows = "󰍲 "
Zorin = " "

[shell]
disabled = false
style = "bg:#FFFFFF fg:#000000"
format = '[$indicator]($style)'
fish_indicator = 'fish'

[directory]
style = "bg:#33658A"
format = "[  $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bg:#FFFFFF fg:#000000"
format = "\b[ $symbol $branch ]($style)"

[git_status]
conflicted = ''
ahead = '  ${count} '
behind = '  ${count} '
diverged = ' 󰹹 ${count} '
untracked = '  ${count} '
modified = '  ${count} '
staged = '  ${count} '
stashed = '  '
deleted = '  ${count} '
style = "bg:#ffffff fg:#000000"
format = '[$all_status$ahead_behind ]($style)[](fg:#FFFFFF)'

[cmake]
format = "\b[ $symbol($version )]($style)[](fg:#FFFFFF)"
symbol = ' '
style = "bg:#ffffff fg:#000000"

[gradle]
format = "\b[ $symbol($version )]($style)[](fg:#FFFFFF)"
symbol = ' '
style = "bg:#ffffff fg:#000000"

[nodejs]
format = "\b[ $symbol($version )]($style)[](fg:#FFFFFF)"
symbol = ' '
style = "bg:#ffffff fg:#000000"

[python]
format = "\b[ ${symbol}${pyenv_prefix}(${version} )(($virtualenv) )]($style)[](fg:#FFFFFF)"
symbol = ' '
style = "bg:#ffffff fg:#000000"

[rust]
format = "\b[ $symbol($version )]($style)[](fg:#FFFFFF)"
symbol = '󱘗 '
style = "bg:#ffffff fg:#000000"

[status]
disabled = false
style = 'bold green bg:#2f332f'
failure_style = 'fg:#ef0b0b bg:#2f332f'
symbol = ''
success_symbol = ''
format = '[ $symbol $status ]($style)'

[cmd_duration]
format = '[ 󱦟 $duration ]($style)'
style = 'bg:#FFFFFF fg:#000000'
min_time = 500

# Disable the package module, hiding it from the prompt completely
[package]
disabled = false
format = "\b[ $symbol($version )]($style)[](fg:#FFFFFF)"
symbol = ' '
style = "bg:#ffffff fg:#000000"

[aws]
disabled = true

[azure]
disabled = true

[battery]
disabled = true

[line_break]
disabled = true

[gcloud]
disabled = true
