SUSE = " "
Ubuntu = " "
Ultramarine = " "
Unknown = " "
Uos = " "
Void = " "
Windows = "󰍲 "
Zorin = " "

[directory]
style = "bg:#33658A"
format = "[  $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bg:#f28213"
format = '[ $symbol $branch ]($style)'

[git_status]
conflicted = ''
ahead = '${count} '
behind = '${count} '
diverged = '${count}'
untracked = '${count} '
modified = '${count} '
staged = '${count} '
stashed = ''
deleted = '${count} '
style = "bg:#f28213"
format = '[$all_status$ahead_behind ]($style)'

[status]
disabled = false
style = 'bold green'
failure_style = 'bold red'
symbol = ''
success_symbol = ''
format = '[ $symbol $status ]($style)'

[cmd_duration]
format = '[ 󱦟 $duration ]($style)'
style = 'bg:#FFFFFF fg:#000000'
min_time = 500

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

[aws]
disabled = true

[azure]
disabled = true

[battery]
disabled = true

[line_break]
disabled = true

[gcloud]
disabled = true
